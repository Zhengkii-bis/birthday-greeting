<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Greeting</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="heading">
        <h3 id="heading-text">Is it your birthday?</h3>
    </div>

    <div id="hero" style="display: block;">
        <h2>Hello! What's your name?</h2>
        <input type="text" id="nameinput" placeholder="Ex: Jayson Simballa">
        <br>
        <button id="enterbutton"> Enter </button>
        <p>Note: follow the format in the placeholder to properly find your information; Ex: Jayson Simballa.</p>
    </div>

    <div id="result" style="display: none;">
        <img id="gif-left" class="party-gif" src="gifs/tenor.gif" alt="">
        <img id="gif-right" class="party-gif" src="gifs/tenor (1).gif" alt="">
        <img id="gif-top" class="party-gif" src="gifs/tenor (2).gif" alt="">
        <img id="photo" src="" alt="">
        <p id="name"></p>
        <p id="birthday"></p>
        <p id="message"></p>
        <audio id="song-player" style="display:none;" controls></audio>
        <br>
        <button id="backbutton"> Back </button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="script.js"></script>
</body>
</html>
